<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
<style>
        body {
            background: url("{{ url_for('static', filename='Diseño.png') }}") no-repeat center center fixed;
            background-size: cover;
        }
    </style>

</head>
<body class="bg-light">
    
    <div class="d-flex align-items-center bg-primary p-3 mb-3">

    <!-- ✅ Logo -->
    <img src="{{ url_for('static', filename='logo3.png') }}" 
         style="width: 40px; margin-right: 10px;">

    <!-- ✅ Título centrado automáticamente -->
    <h3 class="text-white m-0 mx-auto">
        Lechoneria Bucaneros
    </h3>

</div>


<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-4">

            <div class="card p-4 shadow">
                
<div class="d-flex justify-content-center mb-3">
    <img src="{{ url_for('static', filename='logo3.png') }}" alt="Logo" style="width: 120px;">
</div>

                
                <h3 class="text-center mb-3"> Login</h3>

                <input type="text" id="username" class="form-control mb-2" placeholder="Usuario">

                <input type="password" id="password" class="form-control mb-3" placeholder="Contraseña">

                <button class="btn btn-primary w-100" onclick="login()">Ingresar</button>

            </div>

        </div>
    </div>

</div>
<script>
    
function login() {

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    fetch("http://127.0.0.1:5000/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username: username,
            password: password
        })
    })
    .then(res => res.json())
    .then(data => {

        if (data.token) {

            // ✅ Guardar token
            localStorage.setItem("token", data.token);

            alert("Login exitoso ✅");

            // ✅ Redirigir a tu sistema
            window.location.href = "/index";  // o index principal

        } else {
            alert("Credenciales incorrectas ❌");
        }

    })
    .catch(error => console.log("ERROR:", error));
}
</script>
</body>
</html>
