<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-4">

            <div class="card p-4 shadow">

                <h3 class="text-center mb-3">🔐 Login</h3>

                <input type="text" id="username" class="form-control mb-2" placeholder="Usuario">

                <input type="password" id="password" class="form-control mb-3" placeholder="Contraseña">

                <button class="btn btn-primary w-100" onclick="login()">Ingresar</button>

            </div>

        </div>
    </div>

</div>
<script>
    
function login() {

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    fetch("http://127.0.0.1:5000/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username: username,
            password: password
        })
    })
    .then(res => res.json())
    .then(data => {

        if (data.token) {

            // ✅ Guardar token
            localStorage.setItem("token", data.token);

            alert("Login exitoso ✅");

            // ✅ Redirigir a tu sistema
            window.location.href = "/index";  // o index principal

        } else {
            alert("Credenciales incorrectas ❌");
        }

    })
    .catch(error => console.log("ERROR:", error));
}

</script>
</body>
</html>
